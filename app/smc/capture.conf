# Optional AICLK + VCORE TDP CSM capture (leftover csm_app from _end to sram_end).
#
# Production prj.conf leaves CONFIG_TT_BH_ARC_CAPTURE off. Enable a lab/debug
# image with:
#   west build --sysbuild -p -b tt_blackhole@p150a/tt_blackhole/smc app/smc \
#     -DEXTRA_CONF_FILE=capture.conf
#
CONFIG_TT_BH_ARC_CAPTURE=y
